<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Live Translate</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #cap { flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box;
    padding: 20px 20px 8px; font-size: 32px; line-height: 1.35; }
  #cap div { margin-bottom: 0.6em; overflow-wrap: anywhere; }
  #cap .hint { color: #888; }
  #bar { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 14px; background: #000; }
  .row { display: flex; gap: 8px; align-items: center; }
  select, button { background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 8px;
    font-size: 16px; padding: 12px 10px; min-width: 0; }
  select { flex: 1; }
  button { cursor: pointer; }
  #toggle { flex: 1; font-weight: 600; background: #fff; color: #000; border-color: #fff; }
  #toggle.on { background: #b00020; color: #fff; border-color: #b00020; }
  #status { color: #888; font-size: 12px; min-height: 1.2em; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* Landscape: captions use the full width, controls move to a slim right column. */
  @media (orientation: landscape) {
    #app { flex-direction: row; }
    #cap { padding: 12px 12px 12px 24px; font-size: 36px; }
    #bar { width: 210px; flex: none; overflow-y: auto; padding: 12px 12px 12px 4px; justify-content: center; }
    .row { flex-direction: column; align-items: stretch; }
    .row.sizes { flex-direction: row; }
    .row.sizes button { flex: 1; }
    .arrow { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="cap" aria-live="polite"><div class="hint">Tap Start</div></div>
  <div id="bar">
    <div id="status"></div>
    <div class="row">
      <select id="from" aria-label="Spoken language"></select>
      <span class="arrow">→</span>
      <select id="to" aria-label="Translate to"></select>
    </div>
    <div class="row sizes">
      <button id="smaller" aria-label="Smaller text">A−</button>
      <button id="larger" aria-label="Larger text">A+</button>
      <button id="toggle">Start</button>
    </div>
  </div>
</div>

<script>
(function () {
  var SOURCES = [
    ["English", "en-US", "en"], ["French", "fr-FR", "fr"], ["Spanish", "es-ES", "es"],
    ["German", "de-DE", "de"], ["Italian", "it-IT", "it"], ["Turkish", "tr-TR", "tr"],
    ["Japanese", "ja-JP", "ja"], ["Korean", "ko-KR", "ko"], ["Russian", "ru-RU", "ru"],
    ["Arabic", "ar-DZ", "ar"]
  ];
  var TARGETS = [
    ["Arabic", "ar"], ["English", "en"], ["French", "fr"], ["Spanish", "es"],
    ["German", "de"], ["Turkish", "tr"], ["Italian", "it"], ["Russian", "ru"]
  ];
  var MAX_LINES = 6;

  var $ = function (id) { return document.getElementById(id); };
  var cap = $("cap"), fromSel = $("from"), toSel = $("to"), toggle = $("toggle"), statusEl = $("status");

  SOURCES.forEach(function (s, i) { fromSel.add(new Option(s[0], i)); });
  TARGETS.forEach(function (t, i) { toSel.add(new Option(t[0], i)); });
  toSel.value = "0";

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  fromSel.value = load("from", "0");
  toSel.value = load("to", "0");
  var size = parseInt(load("size", ""), 10) || 0;
  function applySize() { if (size) cap.style.fontSize = size + "px"; }
  applySize();

  fromSel.onchange = function () { save("from", fromSel.value); if (running) restart(); };
  toSel.onchange = function () { save("to", toSel.value); };

  function bump(d) {
    var cur = size || parseFloat(getComputedStyle(cap).fontSize);
    size = Math.max(16, Math.min(90, Math.round(cur + d)));
    save("size", size); applySize();
  }
  $("smaller").onclick = function () { bump(-4); };
  $("larger").onclick = function () { bump(4); };

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, running = false, wake = null;
  var items = [];          // finished sentences: {text}
  var partial = "";
  var partialSeq = 0, partialTimer = null;

  function setStatus(t) { statusEl.textContent = t || ""; }

  function render() {
    cap.textContent = "";
    var shown = items.filter(function (i) { return i.text; }).slice(-MAX_LINES).map(function (i) { return i.text; });
    if (partial) shown.push(partial);
    if (!shown.length) {
      var h = document.createElement("div"); h.className = "hint";
      h.textContent = running ? "Listening…" : "Tap Start"; cap.appendChild(h); return;
    }
    shown.forEach(function (t) {
      var d = document.createElement("div"); d.setAttribute("dir", "auto"); d.textContent = t; cap.appendChild(d);
    });
    cap.scrollTop = cap.scrollHeight;
  }

  function translate(text, from, to) {
    if (from === to) return Promise.resolve(text);
    var q = text.slice(0, 450);
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) +
      "&langpair=" + from + "|" + to;
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var t = j && j.responseData && j.responseData.translatedText;
      if (!t) throw new Error("no translation");
      return t;
    });
  }

  function langs() { return { from: SOURCES[fromSel.value][2], to: TARGETS[toSel.value][1] }; }

  function onFinal(text) {
    text = text.trim(); if (!text) return;
    var L = langs(), item = { text: "" };
    items.push(item);
    translate(text, L.from, L.to).then(function (t) { item.text = t; })
      .catch(function () { item.text = text; setStatus("Translation failed, showing original. Check internet."); })
      .then(function () { partial = ""; render(); });
  }

  function onInterim(text) {
    clearTimeout(partialTimer);
    partialTimer = setTimeout(function () {
      var my = ++partialSeq, L = langs();
      translate(text, L.from, L.to).then(function (t) {
        if (my === partialSeq && running) { partial = t; render(); }
      }).catch(function () {});
    }, 350);
  }

  function begin() {
    if (!SR) { setStatus("This browser has no speech recognition. Open the page in Chrome."); return; }
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = SOURCES[fromSel.value][1];
    rec.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) { partialSeq++; onFinal(r[0].transcript); }
        else interim += r[0].transcript;
      }
      if (interim) onInterim(interim);
    };
    rec.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        stop(); setStatus("Microphone blocked. Allow it for this page in Chrome's site settings.");
      } else if (e.error === "network") {
        setStatus("Speech service unreachable. Check internet.");
      }
    };
    rec.onend = function () { if (running) { try { rec.start(); } catch (e) {} } };
    try { rec.start(); } catch (e) { setStatus("Could not start: " + e.message); }
  }

  function keepAwake() {
    try {
      if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { wake = l; }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (running && document.visibilityState === "visible") keepAwake();
  });

  function start() {
    running = true; items = []; partial = ""; setStatus("");
    toggle.textContent = "Stop"; toggle.classList.add("on");
    keepAwake(); render(); begin();
  }
  function stop() {
    running = false; clearTimeout(partialTimer); partialSeq++;
    try { rec && rec.stop(); } catch (e) {}
    try { wake && wake.release(); } catch (e) {}
    toggle.textContent = "Start"; toggle.classList.remove("on");
    partial = ""; render();
  }
  function restart() { try { rec && (rec.onend = null, rec.stop()); } catch (e) {} begin(); }

  toggle.onclick = function () { running ? stop() : start(); };
  if (!SR) setStatus("Open this page in Chrome for speech recognition.");
})();
</script>
</body>
</html>
